<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="chat-app">
    <header class="chat-header">
        <div class="logo" aria-hidden="true">AI</div>
        <div>
            <h1>AI Assistant</h1>
            <p><span class="status-dot"></span>온라인</p>
        </div>
    </header>

    <section id="messages" class="messages" aria-live="polite" aria-label="채팅 메시지">
        <div class="message-row assistant">
            <div class="avatar" aria-hidden="true">AI</div>
            <div class="bubble">안녕하세요! 무엇을 도와드릴까요?</div>
        </div>
    </section>

    <form id="chat-form" class="composer">
        <label class="sr-only" for="message-input">메시지</label>
        <textarea id="message-input" rows="1" placeholder="메시지를 입력하세요" autocomplete="off"></textarea>
        <button id="action-button" type="submit" aria-label="메시지 전송">
            <span class="send-icon" aria-hidden="true">➤</span>
            <span class="button-label">전송</span>
        </button>
    </form>
</main>
<script src="/app.js"></script>
</body>
</html>
