<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Chat</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <main class="app-shell">
    <section class="chat-panel" aria-label="Campus shopping support chat">
      <header class="chat-header">
        <div>
          <p class="eyebrow">Campus Mall</p>
          <h1>고객지원 채팅</h1>
        </div>
        <span class="status-dot" aria-label="online"></span>
      </header>

      <div id="chatMessages" class="chat-messages" aria-live="polite"></div>

      <form id="chatForm" class="composer" autocomplete="off">
        <textarea id="messageInput" name="message" rows="1" placeholder="메시지를 입력하세요" required></textarea>
        <button id="sendButton" type="submit" aria-label="send message">
          <span aria-hidden="true">↑</span>
        </button>
      </form>
    </section>
  </main>
</body>
</html>
