<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 채팅</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <main class="mx-auto flex min-h-screen w-full max-w-3xl items-center px-4 py-6 sm:px-6">
    <section id="startScreen" class="w-full rounded-2xl bg-white p-8 shadow-sm sm:p-10">
      <div class="mx-auto max-w-sm text-center">
        <h1 class="text-2xl font-bold tracking-tight">AI와 대화하기</h1>
        <p class="mt-2 text-sm text-slate-500">사용자 아이디를 입력해 대화를 시작하세요.</p>

        <form id="startForm" class="mt-8 space-y-4">
          <div class="text-left">
            <label for="userId" class="mb-2 block text-sm font-medium">사용자 아이디</label>
            <input
              id="userId"
              name="userId"
              type="text"
              maxlength="100"
              autocomplete="username"
              placeholder="아이디를 입력하세요"
              required
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
            >
            <p id="startError" class="mt-2 hidden text-sm text-red-600" role="alert"></p>
          </div>
          <button type="submit" class="w-full rounded-xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200">
            대화 시작
          </button>
        </form>
      </div>
    </section>

    <section id="chatScreen" class="hidden h-[calc(100vh-3rem)] max-h-[760px] min-h-[520px] w-full overflow-hidden rounded-2xl bg-white shadow-sm" aria-label="대화 화면">
      <div class="flex h-full flex-col">
        <header class="flex items-center justify-between border-b border-slate-200 px-5 py-4 sm:px-6">
          <div class="min-w-0">
            <p class="text-xs font-medium text-slate-500">현재 사용자</p>
            <h1 id="currentUserId" class="truncate font-semibold"></h1>
          </div>
          <button id="leaveButton" type="button" class="ml-4 shrink-0 rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-100">
            나가기
          </button>
        </header>

        <div id="messages" class="flex flex-1 flex-col gap-3 overflow-y-auto bg-slate-50 p-5 sm:p-6" aria-live="polite" aria-label="메시지 목록">
          <p id="emptyMessage" class="m-auto text-center text-sm text-slate-400">메시지를 보내 대화를 시작해 보세요.</p>
        </div>

        <form id="chatForm" class="border-t border-slate-200 p-4 sm:p-5">
          <div class="flex items-end gap-3">
            <label for="messageInput" class="sr-only">메시지</label>
            <textarea
              id="messageInput"
              rows="1"
              maxlength="4000"
              placeholder="메시지를 입력하세요"
              required
              class="max-h-32 min-h-11 flex-1 resize-none rounded-xl border border-slate-300 px-4 py-2.5 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100 disabled:bg-slate-100"
            ></textarea>
            <button id="sendButton" type="submit" class="h-11 shrink-0 rounded-xl bg-blue-600 px-5 font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200 disabled:cursor-not-allowed disabled:opacity-50">
              전송
            </button>
          </div>
          <p id="chatStatus" class="mt-2 min-h-5 text-sm text-slate-500" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <script>
    const startScreen = document.querySelector("#startScreen");
    const chatScreen = document.querySelector("#chatScreen");
    const startForm = document.querySelector("#startForm");
    const userIdInput = document.querySelector("#userId");
    const startError = document.querySelector("#startError");
    const currentUserId = document.querySelector("#currentUserId");
    const leaveButton = document.querySelector("#leaveButton");
    const chatForm = document.querySelector("#chatForm");
    const messageInput = document.querySelector("#messageInput");
    const sendButton = document.querySelector("#sendButton");
    const messages = document.querySelector("#messages");
    const chatStatus = document.querySelector("#chatStatus");

    let activeUserId = "";
    let requestInProgress = false;

    startForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const userId = userIdInput.value.trim();

      if (!userId) {
        startError.textContent = "사용자 아이디를 입력해 주세요.";
        startError.classList.remove("hidden");
        userIdInput.focus();
        return;
      }

      startError.classList.add("hidden");
      activeUserId = userId;
      currentUserId.textContent = userId;
      startScreen.classList.add("hidden");
      chatScreen.classList.remove("hidden");
      messageInput.focus();
    });

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = messageInput.value.trim();

      if (!message || !activeUserId || requestInProgress) return;

      addMessage("user", message);
      messageInput.value = "";
      setSending(true);

      try {
        const response = await fetch(`/chats?id=${encodeURIComponent(activeUserId)}`, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: message
        });
        const responseText = await response.text();

        if (!response.ok) {
          throw new Error(responseText || `서버 오류 (${response.status})`);
        }

        addMessage("assistant", responseText || "응답 내용이 없습니다.");
      } catch (error) {
        addMessage("error", `메시지를 보내지 못했습니다. ${error.message}`);
      } finally {
        setSending(false);
        messageInput.focus();
      }
    });

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });

    leaveButton.addEventListener("click", async () => {
      if (!activeUserId || requestInProgress) return;

      leaveButton.disabled = true;
      chatStatus.textContent = "대화를 종료하는 중...";

      try {
        const response = await fetch(`/chats?id=${encodeURIComponent(activeUserId)}`, {
          method: "DELETE"
        });

        if (!response.ok) {
          const responseText = await response.text();
          throw new Error(responseText || `서버 오류 (${response.status})`);
        }

        showStartScreen();
      } catch (error) {
        chatStatus.textContent = `나가지 못했습니다. ${error.message}`;
      } finally {
        leaveButton.disabled = false;
      }
    });

    function addMessage(type, text) {
      document.querySelector("#emptyMessage")?.remove();

      const wrapper = document.createElement("div");
      const bubble = document.createElement("div");
      wrapper.className = type === "user" ? "flex justify-end" : "flex justify-start";
      bubble.className = type === "user"
        ? "max-w-[85%] whitespace-pre-wrap break-words rounded-2xl rounded-br-md bg-blue-600 px-4 py-3 text-sm leading-6 text-white"
        : type === "error"
          ? "max-w-[85%] whitespace-pre-wrap break-words rounded-2xl rounded-bl-md bg-red-50 px-4 py-3 text-sm leading-6 text-red-700 ring-1 ring-red-200"
          : "max-w-[85%] whitespace-pre-wrap break-words rounded-2xl rounded-bl-md bg-white px-4 py-3 text-sm leading-6 text-slate-800 shadow-sm ring-1 ring-slate-200";
      bubble.textContent = text;
      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;
    }

    function setSending(isSending) {
      requestInProgress = isSending;
      sendButton.disabled = isSending;
      messageInput.disabled = isSending;
      leaveButton.disabled = isSending;
      chatStatus.textContent = isSending ? "AI의 답변을 기다리는 중..." : "";
    }

    function showStartScreen() {
      activeUserId = "";
      currentUserId.textContent = "";
      userIdInput.value = "";
      messageInput.value = "";
      chatStatus.textContent = "";
      messages.replaceChildren();

      const emptyMessage = document.createElement("p");
      emptyMessage.id = "emptyMessage";
      emptyMessage.className = "m-auto text-center text-sm text-slate-400";
      emptyMessage.textContent = "메시지를 보내 대화를 시작해 보세요.";
      messages.appendChild(emptyMessage);

      chatScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
      userIdInput.focus();
    }
  </script>
</body>
</html>
